name: Deploy academic website

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Refresh 51LA data even if already attempted today (up to 3 API calls)'
        type: boolean
        required: false
        default: false
      diagnose_stats:
        description: 'Compare homepage app identity and today/yesterday/total counters (2 read-only API calls)'
        type: boolean
        required: false
        default: false
  schedule:
    # Asia/Shanghai (UTC+8): 03:00 primary, then 04:00 / 05:00 / 06:00 backups.
    # Each UTC trigger falls on the preceding calendar day.
    - cron: '0 19 * * *'
    - cron: '0 20 * * *'
    - cron: '0 21 * * *'
    - cron: '0 22 * * *'

permissions:
  contents: read

concurrency:
  group: pages
  # A delayed backup must wait for, not cancel, an active sync/deployment.
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.plan.outputs.should_run }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check whether today's data is already published
        id: plan
        env:
          LA_SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: node scripts/check-51la-sync.mjs

  build:
    needs: plan
    if: needs.plan.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build and validate
        run: |
          python3 build.py
          node --check src/analytics.js
          node --check src/app.js
          node --check src/visitors.js
          node --check src/visitor-globe.js
          node --test tests/*.test.cjs

      - name: Determine 51LA reporting day
        id: analytics-day
        run: node --input-type=module -e "import { chinaDay } from './scripts/51la-client.mjs'; console.log('day=' + chinaDay())" >> "$GITHUB_OUTPUT"

      - name: Compare 51LA application and aggregate counters
        if: (github.event_name == 'workflow_dispatch' && inputs.diagnose_stats) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[diagnose-51la]'))
        env:
          LA_ACCESS_KEY: ${{ secrets.LA_ACCESS_KEY }}
          LA_SECRET_KEY: ${{ secrets.LA_SECRET_KEY }}
        run: node scripts/51la-client.mjs --compare-statistics

      - name: Restore public statistics cache
        id: analytics-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/51la/visitor-data.json
          key: 51la-public-v2-${{ steps.analytics-day.outputs.day }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            51la-public-v2-${{ steps.analytics-day.outputs.day }}-
            51la-public-v2-
            51la-public-v1-

      - name: Synchronize public 51LA aggregates
        env:
          LA_ACCESS_KEY: ${{ secrets.LA_ACCESS_KEY }}
          LA_SECRET_KEY: ${{ secrets.LA_SECRET_KEY }}
          # A manual refresh may override success. Scheduled retries may only
          # bypass a failed attempt; successful data is always reused.
          LA_FORCE_SYNC: ${{ (github.event_name == 'workflow_dispatch' && inputs.force_sync) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[force-51la-sync]')) }}
          LA_RETRY_SYNC: ${{ github.event_name == 'schedule' }}
        run: node scripts/sync-51la.mjs

      - name: Cache public statistics for this day
        if: steps.analytics-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/51la/visitor-data.json
          key: 51la-public-v1-${{ steps.analytics-day.outputs.day }}

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
