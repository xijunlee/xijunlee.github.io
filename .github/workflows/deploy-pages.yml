name: Deploy academic website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify 51LA data access
        env:
          LA_ACCESS_KEY: ${{ secrets.LA_ACCESS_KEY }}
          LA_SECRET_KEY: ${{ secrets.LA_SECRET_KEY }}
          LA_CONFIG_NAMES: >-
            {"LA_ACCESS_KEY":${{ secrets.LA_ACCESS_KEY != '' }},"LA_SECRET_KEY":${{ secrets.LA_SECRET_KEY != '' }},"ACCESSKEY":${{ secrets.ACCESSKEY != '' }},"SECRETKEY":${{ secrets.SECRETKEY != '' }},"ACCESS_KEY":${{ secrets.ACCESS_KEY != '' }},"SECRET_KEY":${{ secrets.SECRET_KEY != '' }},"variables":{"LA_ACCESS_KEY":${{ vars.LA_ACCESS_KEY != '' }},"LA_SECRET_KEY":${{ vars.LA_SECRET_KEY != '' }}}}
        run: node scripts/51la-client.mjs

      - name: Build and validate
        run: |
          python3 build.py
          node --check src/analytics.js
          node --check src/app.js
          node --check src/visitors.js
          node --check src/visitor-globe.js
          node --test tests/*.test.cjs

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
