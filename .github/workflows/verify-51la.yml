name: Verify 51LA data access

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-51la.yml'
      - 'scripts/51la-client.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify signed 51LA API requests
        env:
          LA_ACCESS_KEY: ${{ secrets.LA_ACCESS_KEY }}
          LA_SECRET_KEY: ${{ secrets.LA_SECRET_KEY }}
          LA_CONFIG_NAMES: >-
            {"LA_ACCESS_KEY":${{ secrets.LA_ACCESS_KEY != '' }},"LA_SECRET_KEY":${{ secrets.LA_SECRET_KEY != '' }}}
        # The overview request was already verified; avoid spending another call.
        run: node scripts/51la-client.mjs --regions-only
